name: Documentation Issue
description: Report missing, incorrect, unclear, or outdated documentation.
title: "[Docs]: "
labels: "documentation"
body:
- type: markdown
  attributes:
   value: |
    ## Documentation Issue

     ```
     Thank you for helping improve the OQubit documentation!
     Please provide enough information for us to understand and reproduce the documentation issue.
     ```
- type: textarea
  id: issue-description
  attributes:
    label: Documentation Issue
    description: Describe the documentation problem in detail.
    placeholder: |
      Please describe what is missing, incorrect, unclear, or outdated.
  validations:
    required: true
- type: input
  id: documentation-location
  attributes:
    label: Documentation Location
    description: Provide the URL, file path, page, or section where the issue occurs.
    placeholder: |
      Example: docs/user-guide/gates.md
  validations:
    required: true
- type: dropdown
  id: issue-type
  attributes:
    label: Documentation Issue Type
    description: Select the type of documentation issue.
    multiple: true
    options:
      - Missing Documentation
      - Incorrect Information
      - Outdated Information
      - Unclear Explanation
      - Typographical Error
      - Broken Link
      - Code Example
      - API Documentation
      - Formatting
      - Other
  validations:
    required: true
- type: textarea
  id: current-content
  attributes:
    label: Current Content
    description: If applicable, provide the relevant documentation text or code that needs to be changed.
    placeholder: |
      Paste the relevant section here.
  validations:
    required: false
- type: textarea
  id: suggested-change
  attributes:
    label: Suggested Change
    description: Describe how you think the documentation could be improved.
    placeholder: |
      Explain what should be added, removed, corrected, or rewritten.
  validations:
    required: false
- type: textarea
  id: additional-context
  attributes:
    label: Additional Context
    description: Add any other information, screenshots, examples, or references that may help.
    placeholder: |
      Add any additional context here.
  validations:
    required: false